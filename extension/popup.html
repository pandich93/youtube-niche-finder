<!doctype html>
<meta charset="utf-8">
<title>niche-finder</title>
<link rel="stylesheet" href="popup.css">
<div class="wrap">
  <h1>niche&#8209;finder</h1>
  <div id="status" class="status">проверяю связь…</div>

  <label class="field">
    <span>Адрес локального бэкенда</span>
    <input id="baseUrl" type="text" spellcheck="false" placeholder="http://127.0.0.1:8080">
  </label>

  <label class="field">
    <span>Токен доступа (только если на сервере включён вход)</span>
    <input id="apiToken" type="password" spellcheck="false" autocomplete="off" placeholder="nf_…">
  </label>

  <label class="check">
    <input id="autoFetch" type="checkbox">
    <span>Добирать из YouTube API то, чего нет в базе
      <em>1-2 units на страницу, данные сохраняются локально</em></span>
  </label>

  <label class="check">
    <input id="showBadges" type="checkbox">
    <span>Значки с множителем на карточках видео</span>
  </label>

  <label class="check">
    <input id="onlyOutliers" type="checkbox">
    <span>Показывать значок только у выбросов (от ×1,5)</span>
  </label>

  <label class="check">
    <input id="showVph" type="checkbox">
    <span>Второй значок — просмотров в час
      <em>под превью, синим; за 24ч если есть история, иначе за всё время</em></span>
  </label>

  <details class="md-details" id="alertsDetails">
    <summary>Алерты <span id="alertsCount"></span></summary>
    <div class="md-form">
      <div id="alertsBody" class="md-result"><div class="md-summary">загрузка…</div></div>
      <div class="row">
        <button id="alertsScan" class="btn" type="button">Проверить сейчас</button>
        <button id="alertsMarkSeen" class="btn ghost" type="button">Отметить прочитанным</button>
      </div>
    </div>
  </details>

  <details class="md-details">
    <summary>Разбор метаданных черновика</summary>
    <div class="md-form">
      <label class="field">
        <span>Заголовок</span>
        <input id="mdTitle" type="text" placeholder="5 секретов нейросетей, о которых молчат">
      </label>
      <label class="field">
        <span>Описание</span>
        <textarea id="mdDesc" rows="2" placeholder="00:00 вступление..."></textarea>
      </label>
      <label class="field">
        <span>Теги (через запятую)</span>
        <input id="mdTags" type="text" placeholder="нейросети, ai">
      </label>
      <label class="field">
        <span>Ниша</span>
        <input id="mdNiche" type="text" placeholder="ai-explainers">
      </label>
      <label class="field">
        <span>ID канала (необязательно)</span>
        <input id="mdChannel" type="text" placeholder="UC...">
      </label>
      <label class="check"><input id="mdShort" type="checkbox"><span>Shorts</span></label>
      <div class="row">
        <button id="mdReview" class="btn" type="button">Проверить</button>
        <button id="mdSave" class="btn ghost" type="button">Сохранить черновик</button>
      </div>
      <div id="mdResult" class="md-result"></div>
    </div>
  </details>

  <div class="row">
    <button id="check" class="btn">Проверить связь</button>
    <a id="dash" class="btn ghost" target="_blank" rel="noopener">Дашборд</a>
  </div>
  <div class="foot">Данные не покидают ваш компьютер: расширение ходит только на localhost.</div>
</div>
<script src="popup.js"></script>
