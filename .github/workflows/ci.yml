name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: niches
          POSTGRES_USER: niches
          POSTGRES_PASSWORD: niches
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U niches -d niches"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt coverage pytest

      # One process per file: several tests swap infrastructure.postgres for a
      # sqlite double in sys.modules, so a single `pytest tests/` run would
      # leak that double into the Postgres-backed files. The glob picks up any
      # new test_*.py without touching this workflow; the loop runs every file
      # and fails the step at the end if any of them failed.
      - name: Run tests with coverage
        working-directory: backend
        run: |
          coverage erase
          failed=""
          for f in tests/test_*.py; do
            echo "::group::$f"
            coverage run -a --source=. --omit="tests/*" -m pytest -q -p no:cacheprovider "$f" || failed="$failed $f"
            echo "::endgroup::"
          done
          coverage report -m
          if [ -n "$failed" ]; then
            echo "::error::failed:$failed"
            exit 1
          fi
          coverage json -o /tmp/coverage_full.json
          python3 -c "
          import json
          d = json.load(open('/tmp/coverage_full.json'))
          json.dump({'totals': d['totals']}, open('../assets/coverage.json', 'w'), indent=2)
          "

      - name: Commit coverage badge data
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/coverage.json
          if ! git diff --cached --quiet; then
            git commit -m "Update coverage badge data [skip ci]"
            git pull --rebase origin main
            git push
          fi

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build web/worker images
        run: docker compose build
