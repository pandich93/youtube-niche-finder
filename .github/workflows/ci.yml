name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: niches
          POSTGRES_USER: niches
          POSTGRES_PASSWORD: niches
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U niches -d niches"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt coverage pytest

      # One pytest process for the whole suite: tests/conftest.py gives every
      # file the world it would see running alone -- Postgres-backed files get
      # a fresh schema each (tests/schema_scope.py), and the sqlite-double
      # files keep their doubles in a private module world instead of
      # sys.modules (tests/module_doubles.py). pytest picks up any new
      # test_*.py by itself. The coverage report is printed either way; a test
      # failure fails the step (and skips the badge data) after it.
      - name: Run tests with coverage
        working-directory: backend
        run: |
          status=0
          coverage run --source=. --omit="tests/*" -m pytest -q -p no:cacheprovider tests/ || status=$?
          coverage report -m
          if [ "$status" -ne 0 ]; then
            echo "::error::pytest exited with status $status"
            exit "$status"
          fi
          coverage json -o /tmp/coverage_full.json
          python3 -c "
          import json
          d = json.load(open('/tmp/coverage_full.json'))
          json.dump({'totals': d['totals']}, open('../assets/coverage.json', 'w'), indent=2)
          "

      - name: Commit coverage badge data
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/coverage.json
          if ! git diff --cached --quiet; then
            git commit -m "Update coverage badge data [skip ci]"
            git pull --rebase origin main
            git push
          fi

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build web/worker images
        run: docker compose build
