name: Release

# Push a tag like v0.2.0 (after moving the CHANGELOG's [Unreleased] entries
# under "## [0.2.0] - <date>" and bumping extension/manifest.json) and this
# workflow publishes the GitHub release: the notes are that CHANGELOG section,
# the asset is the Chrome extension zip built by scripts/package_extension.sh.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the extension and the changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          MANIFEST=$(python3 -c 'import json; print(json.load(open("extension/manifest.json"))["version"])')
          if [ "$MANIFEST" != "$VERSION" ]; then
            echo "::error::extension/manifest.json is $MANIFEST, tag is $TAG"; exit 1
          fi
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section"; exit 1
          fi

      - name: Release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          printf '\n---\n\n**Chrome extension:** download `niche-finder-extension-%s.zip` below, unzip it and load the folder via `chrome://extensions` → Developer mode → Load unpacked. Full history: [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md).\n' \
            "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> release-notes.md
          test -s release-notes.md

      - name: Build the extension zip
        run: sh scripts/package_extension.sh "$GITHUB_REF_NAME"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "niche-finder $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag \
            "dist/niche-finder-extension-$GITHUB_REF_NAME.zip"
