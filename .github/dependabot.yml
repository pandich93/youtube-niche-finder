# Weekly pull requests for outdated dependencies; security fixes come as soon
# as an advisory is out (Dependabot security updates, repository settings).
# backend/requirements.txt is compiled from requirements.in by uv: Dependabot
# updates the pinned line, and CI runs the full test suite on it.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python:
        update-types: [minor, patch]

  # Playwright for the dashboard smoke test
  - package-ecosystem: pip
    directory: /frontend/tests
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
